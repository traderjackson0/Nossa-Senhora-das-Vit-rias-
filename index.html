<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2a4a">
  <meta name="description" content="Sistema de Gestão Escolar — Nossa Senhora Das Vitórias, Instituto Médio Privado de Saúde">
  <title>NSDV • Gestão Escolar</title>

  <style>
    :root{
      --navy:#0b2a4a;
      --navy2:#123d66;
      --blue:#1677ff;
      --bg:#f4f7fb;
      --card:#fff;
      --text:#172033;
      --muted:#6d7889;
      --line:#e5eaf1;
      --danger:#d92d3b;
      --ok:#16834a;
      --warn:#b66b00;
      --shadow:0 10px 30px rgba(16,38,64,.08);
      --r:16px;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color:var(--text);
      background:var(--bg);
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{
      display:none!important;
    }

    /* =========================================================
       LOGIN
    ========================================================= */

    .login{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(
          circle at top,
          #1b5b91,
          #081d34 60%
        );
    }

    .login-card{
      width:min(440px,100%);
      background:#fff;
      border-radius:24px;
      padding:28px;
      box-shadow:0 25px 70px rgba(0,0,0,.28);
    }

    .brand{
      text-align:center;
    }

    .brand img{
      width:92px;
      height:92px;
      object-fit:contain;
      border-radius:18px;
    }

    .brand h1{
      font-size:22px;
      margin:12px 0 4px;
      color:var(--navy);
    }

    .brand p{
      margin:0 0 20px;
      color:var(--muted);
      font-size:13px;
    }

    .field{
      display:grid;
      gap:7px;
      margin:12px 0;
    }

    .field label{
      font-size:13px;
      font-weight:700;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:11px;
      padding:12px 13px;
      outline:none;
      background:#fff;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(22,119,255,.10);
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:11px 14px;
      font-weight:800;
    }

    .btn.primary{
      background:var(--blue);
      color:#fff;
    }

    .btn.secondary{
      background:#edf3f9;
      color:var(--navy);
    }

    .btn.danger{
      background:#fff0f1;
      color:var(--danger);
    }

    .btn.ok{
      background:#eaf8f0;
      color:var(--ok);
    }

    .btn.full{
      width:100%;
      margin-top:8px;
    }

    .msg{
      font-size:13px;
      margin-top:10px;
      padding:10px 12px;
      border-radius:10px;
    }

    .msg.error{
      background:#fff0f1;
      color:var(--danger);
    }

    .msg.ok{
      background:#eaf8f0;
      color:var(--ok);
    }

    /* =========================================================
       APP
    ========================================================= */

    .app{
      min-height:100vh;
    }

    .shell{
      display:flex;
      min-height:100vh;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .side{
      width:270px;
      background:var(--navy);
      color:#fff;
      position:fixed;
      inset:0 auto 0 0;
      z-index:30;
      padding:18px 14px;
      overflow:auto;
      transition:.25s;
    }

    .side.closed{
      transform:translateX(-100%);
    }

    .side-brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:6px 8px 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
    }

    .side-brand img{
      width:42px;
      height:42px;
      object-fit:contain;
      border-radius:10px;
    }

    .side-brand strong{
      font-size:13px;
      line-height:1.15;
    }

    .nav{
      padding-top:14px;
    }

    .nav button{
      width:100%;
      border:0;
      background:transparent;
      color:#dce8f5;
      text-align:left;
      padding:12px;
      border-radius:11px;
      margin:2px 0;
      font-weight:700;
    }

    .nav button:hover,
    .nav button.active{
      background:rgba(255,255,255,.12);
      color:#fff;
    }

    .nav .section{
      font-size:10px;
      color:#8fa7c0;
      padding:14px 12px 5px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .main{
      margin-left:270px;
      min-width:0;
      flex:1;
    }

    .top{
      height:66px;
      background:#fff;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 18px;
      position:sticky;
      top:0;
      z-index:20;
    }

    .hamb{
      display:none;
      border:0;
      background:#eef3f8;
      border-radius:10px;
      padding:9px;
    }

    .top-title{
      font-weight:900;
      flex:1;
    }

    .user-pill{
      font-size:12px;
      background:#eef4fb;
      border-radius:999px;
      padding:8px 11px;
      color:var(--navy);
      font-weight:800;
    }

    /* =========================================================
       CONTENT
    ========================================================= */

    .content{
      padding:20px;
      max-width:1500px;
      margin:auto;
    }

    .page-head{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
    }

    .page-head>div:first-child{
      flex:1;
    }

    .page-head h2{
      margin:0 0 5px;
      font-size:24px;
    }

    .page-head p{
      margin:0;
      color:var(--muted);
      font-size:13px;
    }

    /* =========================================================
       GRIDS
    ========================================================= */

    .grid{
      display:grid;
      gap:14px;
    }

    .g4{
      grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .g3{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .g2{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    /* =========================================================
       CARDS
    ========================================================= */

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      padding:16px;
    }

    .stat{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }

    .stat small{
      color:var(--muted);
    }

    .stat strong{
      display:block;
      font-size:27px;
      margin-top:6px;
    }

    .iconbox{
      width:44px;
      height:44px;
      border-radius:13px;
      background:#edf4ff;
      display:grid;
      place-items:center;
      color:var(--blue);
      font-weight:900;
    }

    /* =========================================================
       TOOLBAR
    ========================================================= */

    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .toolbar input,
    .toolbar select{
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 12px;
      background:#fff;
    }

    .toolbar input{
      min-width:230px;
    }

    /* =========================================================
       TABLE
    ========================================================= */

    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:12px;
    }

    .table{
      width:100%;
      border-collapse:collapse;
      min-width:760px;
    }

    .table th,
    .table td{
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      font-size:13px;
      vertical-align:middle;
    }

    .table th{
      background:#f7f9fc;
      color:#526176;
      font-size:11px;
      text-transform:uppercase;
    }

    .table tr:last-child td{
      border-bottom:0;
    }

    /* =========================================================
       BADGES
    ========================================================= */

    .badge{
      display:inline-flex;
      padding:5px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
    }

    .b-ok{
      background:#eaf8f0;
      color:var(--ok);
    }

    .b-warn{
      background:#fff4dd;
      color:var(--warn);
    }

    .b-red{
      background:#fff0f1;
      color:var(--danger);
    }

    .b-blue{
      background:#eaf2ff;
      color:#125ac4;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(5,18,32,.55);
      z-index:80;
      display:grid;
      place-items:center;
      padding:16px;
    }

    .modal-box{
      width:min(680px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:20px;
      padding:18px;
    }

    .modal-head{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .modal-head h3{
      flex:1;
      margin:0;
    }

    .x{
      border:0;
      background:#eef2f6;
      border-radius:9px;
      padding:7px 10px;
    }

    .actions{
      display:flex;
      gap:8px;
      justify-content:flex-end;
      margin-top:16px;
      flex-wrap:wrap;
    }

    /* =========================================================
       ATTENDANCE
    ========================================================= */

    .attendance-grid{
      overflow:auto;
    }

    .att{
      border-collapse:separate;
      border-spacing:0;
      min-width:900px;
      width:100%;
    }

    .att th,
    .att td{
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:7px;
      text-align:center;
      font-size:12px;
    }

    .att th{
      background:#f5f8fb;
      position:sticky;
      top:0;
      z-index:2;
    }

    .att td:first-child,
    .att th:first-child{
      position:sticky;
      left:0;
      background:#fff;
      z-index:3;
      text-align:left;
    }

    .att .present{
      background:#eaf8f0;
      color:var(--ok);
      font-weight:900;
    }

    .att .absent{
      background:#fff0f1;
      color:var(--danger);
      font-weight:900;
    }

    .att .discipline{
      background:#fff4dd;
      color:var(--warn);
      font-weight:900;
    }

    /* =========================================================
       NOTICE
    ========================================================= */

    .notice{
      padding:12px;
      border:1px dashed #cfd8e4;
      border-radius:12px;
      background:#f9fbfd;
      color:#536174;
      font-size:12px;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:28px;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media(max-width:900px){

      .side{
        transform:translateX(-100%);
      }

      .side.open{
        transform:translateX(0);
      }

      .main{
        margin-left:0;
      }

      .hamb{
        display:block;
      }

      .g4{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .g3{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:620px){

      .content{
        padding:12px;
      }

      .g4,
      .g3,
      .g2{
        grid-template-columns:1fr;
      }

      .page-head{
        flex-direction:column;
      }

      .toolbar input{
        min-width:100%;
      }

      .top{
        padding:0 12px;
      }

      .user-pill{
        display:none;
      }
    }
  </style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginView" class="login">

  <div class="login-card">

    <div class="brand">

      <img
        src="https://innocent-red-jrlipu0k.edgeone.dev/"
        alt="Logotipo NSDV"
        onerror="this.style.display='none'"
      >

      <h1>
        Nossa Senhora Das Vitórias
      </h1>

      <p>

      </p>

    </div>

    <form id="loginForm">

      <div class="field">

        <label>

        <input
          id="email"

        >

      <button

    >

      O administrador deve provisionar os utilizadores
      institucionais.
    </div>

  </div>

</div>


<!-- =========================================================
     APPLICATION
========================================================= -->

<div id="appView" class="app hidden">

  <div class="shell">

    <!-- SIDEBAR -->

    <aside id="side" class="side">

      <div class="side-brand">

        <img
          src="https://innocent-red-jrlipu0k.edgeone.dev/"
          alt="NSDV"
        >

        <strong>

        </strong>

      </div>


      <div class="nav">

        <button data-page="search">

        </button>

        <button
          data-page="stats"
          class="admin-only"
        >

        </button>

        <button

        >

        </button>


        <div class="section">
          Sistema
        </div>

        <button data-page="settings">

    <!-- MAIN -->

    <main class="main">

        </button>

        <div

          class="top-title"
        >

        </div>

        <div
          id="userPill"

      </header>


      <section

      ></section>

    </main>

  </div>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h3 id="modalTitle"></h3>

      <button
        class="x"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<!-- =========================================================
     FIREBASE + APPLICATION LOGIC
========================================================= -->

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  setDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  limit,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCgMLNvcGRrTBBTAUSrG6zAfp2fgscagFU",

  authDomain:
    "nsdv-eabc0.firebaseapp.com",

  projectId:
    "nsdv-eabc0",

  storageBucket:
    "nsdv-eabc0.firebasestorage.app",

  messagingSenderId:
    "948800536424",

  appId:
    "1:948800536424:web:e818af05580c22aeafe0dd"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================================================
   GLOBAL STATE
========================================================= */

const $ =
  id => document.getElementById(id);

let currentUser = null;

let currentProfile = null;

let currentPage =
  "dashboard";

let unsubscribeLive = [];


/* =========================================================
   UTILITIES
========================================================= */

const esc = value => {

  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m]));

};


const today = () =>
  new Date()
    .toISOString()
    .slice(0,10);


const money = value =>
  new Intl.NumberFormat(
    "pt-AO",
    {
      style:"currency",
      currency:"AOA",
      maximumFractionDigits:0
    }
  ).format(Number(value || 0));


function msg(text,type="error"){

  return `
    <div class="msg ${type}">
      ${esc(text)}
    </div>
  `;

}


function openModal(title,body){

  $("modalTitle").textContent =
    title;

  $("modalBody").innerHTML =
    body;

  $("modal")
    .classList
    .remove("hidden");

}


window.closeModal = () => {

  $("modal")
    .classList
    .add("hidden");

};


function role(){

  return currentProfile?.role ||
    "teacher";

}


function isAdmin(){

  return role() === "admin";

}


function cleanup(){

  unsubscribeLive
    .forEach(u => u());

  unsubscribeLive = [];

}


function setPage(page){

  currentPage = page;

  document
    .querySelectorAll(
      ".nav button[data-page]"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );

    });


  const titles = {

    dashboard:
      "Dashboard",

    search:
      "Pesquisa inteligente",

    students:
      "Alunos",

    classes:
      "Salas e cursos",

    attendance:
      "Livro de pontos",

    grades:
      "Lançamento de notas",

    payments:
      "Propinas e pagamentos",

    documents:
      "Documentos",

    stats:
      "Estatísticas",

    users:
      "Utilizadores",

    settings:
      "Configurações"

  };


  $("topTitle").textContent =
    titles[page] ||
    "Gestão Escolar";


  cleanup();

  renderPage();

}


function requireAdmin(){

  if(!isAdmin()){

    alert(
      "Acesso reservado à Administração."
    );

    return false;

  }

  return true;

}


/* =========================================================
   LOGIN
========================================================= */

$("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      $("loginMsg").innerHTML = "";

      try{

        await signInWithEmailAndPassword(

          auth,

          $("email")
            .value
            .trim(),

          $("password")
            .value

        );

      }

      catch(error){

        console.error(error);

        $("loginMsg").innerHTML =
          msg(
            "Não foi possível entrar. Confirme o e-mail, a palavra-passe e as regras de acesso."
          );

      }

    }
  );


/* =========================================================
   MENU
========================================================= */

$("logoutBtn").onclick =
  () => signOut(auth);


$("menuBtn").onclick =
  () => {

    $("side")
      .classList
      .toggle("open");

  };


document
  .querySelectorAll(
    ".nav button[data-page]"
  )
  .forEach(button => {

    button.onclick = () => {

      setPage(
        button.dataset.page
      );

      $("side")
        .classList
        .remove("open");

    };

  });


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;

    if(!user){

      $("loginView")
        .classList
        .remove("hidden");

      $("appView")
        .classList
        .add("hidden");

      cleanup();

      return;

    }


    try{

      const snap =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if(!snap.exists()){

        await signOut(auth);

        $("loginMsg").innerHTML =
          msg(
            "Conta sem perfil institucional. O administrador deve provisionar o utilizador."
          );

        return;

      }


      currentProfile =
        snap.data();


      $("userPill").textContent =
        `${
          currentProfile.name ||
          user.email
        } • ${
          currentProfile.role === "admin"
            ? "Administração"
            : "Professor"
        }`;


      document
        .querySelectorAll(
          ".admin-only"
        )
        .forEach(element => {

          element.style.display =
            isAdmin()
              ? ""
              : "none";

        });


      $("loginView")
        .classList
        .add("hidden");

      $("appView")
        .classList
        .remove("hidden");


      setPage("dashboard");

    }

    catch(error){

      console.error(error);

      await signOut(auth);

    }

  }
);

  async (

    name,

    date

    const status =
      $("a_status_" + studentId)
        .value;


    const note =
      $("a_note_" + studentId)
        .value
        .trim();


    const data = {

      studentId,

      studentName:name,

      date,

      status,

      disciplinary:
        status === "FD",

      note,

      teacherId:
        currentUser.uid,

      updatedAt:
        serverTimestamp()

    };


    try{

      if(oldId){

        await updateDoc(
          doc(
            db,
            "attendance",
            oldId
          ),
          data
        );

      }

      else{

        await addDoc(
          collection(
            db,
            "attendance"
          ),
          data
        );

      }


      alert(
        "Registo guardado."
      );


      loadAttendance();

    }

    catch(error){

      console.error(error);

      alert(
        "Sem permissão para guardar este registo."
      );

    }

  };

window.saveGrade =
  async () => {

    const studentId =
      $("g_student").value;


    const subject =
      $("g_subject")
        .value
        .trim();


    const trim =
      Number(
        $("g_trim").value
      );


    const mac =
      Number(
        $("g_cont").value
      );


    const npt =
      Number(
        $("g_test").value
      );


    if(
      !subject ||
      isNaN(mac) ||
      isNaN(npt)
    ){

      return alert(
        "Preencha disciplina e notas."
      );

    }


    const mt =
      (mac + npt) / 2;


    try{

      await addDoc(

        collection(
          db,
          "grades"
        ),

        {

          studentId,

          subject,

          trim,

          mac,

          npt,

          mt,

          teacherId:
            currentUser.uid,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }

      );


      await loadGrades();

    }

    catch(error){

      console.error(error);

      alert(
        "Sem permissão para lançar nota."
      );

    }

  };

window.smartSearch =
  async () => {

    const value =
      $("smartQ")
        .value
        .trim()
        .toLowerCase();


    if(!value){

      return;

    }


    const snapshot =
      await getDocs(
        query(
          collection(
            db,
            "students"
          ),
          orderBy("name")
        )
      );


    const studentsList =
      snapshot.docs
        .map(
          d => ({
            id:d.id,
            ...d.data()
          })
        )
        .filter(
          student =>
            [
              student.id,
              student.name,
              student.room,
              student.phone,
              student.className
            ]
            .join(" ")
            .toLowerCase()
            .includes(value)
        );


    let output = "";


    for(
      const student
      of studentsList.slice(0,20)
    ){

      const [
        attendanceSnapshot,
        gradesSnapshot,
        occurrencesSnapshot
      ] =
        await Promise.all([

          getDocs(
            query(
              collection(
                db,
                "attendance"
              ),
              where(
                "studentId",
                "==",
                student.id
              ),
              limit(100)
            )
          ),

          getDocs(
            query(
              collection(
                db,
                "grades"
              ),
              where(
                "studentId",
                "==",
                student.id
              ),
              limit(100)
            )
          ),

          getDocs(
            query(
              collection(
                db,
                "occurrences"
              ),
              where(
                "studentId",
                "==",
                student.id
              ),
              limit(100)
            )
          )

        ]);


      const absences =
        attendanceSnapshot.docs
          .filter(
            document =>
              [
                "F",
                "FD"
              ].includes(
                document.data().status
              )
          )
          .length;


      const disciplinary =
        attendanceSnapshot.docs
          .filter(
            document =>
              document.data()
                .disciplinary
          )
          .length;


      output += `

        <div
          class="card"
          style="margin-top:10px"
        >

          <div class="stat">

            <div>

              <h3
                style="margin:0"
              >
                ${esc(student.name)}
              </h3>

              <small>

                ${esc(student.id)}
                •
                ${esc(student.className)}
                •
                ${esc(student.room)}

              </small>

            </div>


            <span
              class="badge b-blue"
            >

              ${gradesSnapshot.size}
              notas

            </span>

          </div>


          <hr
            style="
              border:0;
              border-top:1px solid var(--line);
              margin:14px 0
            "
          >


          <div class="grid g3">


            <div>

              <small>
                Faltas
              </small>

              <strong>
                ${absences}
              </strong>

            </div>


            <div>

              <small>
                Disciplinares
              </small>

              <strong>
                ${disciplinary}
              </strong>

            </div>


            <div>

              <small>
                Ocorrências
              </small>

              <strong>
                ${occurrencesSnapshot.size}
              </strong>

            </div>


          </div>

        </div>

      `;

    }


    $("smartResult").innerHTML =
      output ||

      `

        <div class="empty">

          Nenhum aluno encontrado.

        </div>

      `;

  };
